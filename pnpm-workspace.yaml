packages:
  - 'packages/*'
  - 'websites/**/*'

publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '@types*'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  chromedriver: true
  core-js: true
  core-js-pure: true
  esbuild: true
  nodejieba: true
  nx: true
  puppeteer: true
  swiper: true
